name: Package OpenRGB runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openrgb-runtime.yml"
      - "src/ZenoraRGB/Services/OpenRgbRuntimeInstaller.cs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-runtime:
    runs-on: windows-latest
    steps:
      - name: Download official OpenRGB 1.1 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeUrl = "https://codeberg.org/OpenRGB/OpenRGB/releases/download/release_1.1/OpenRGB_1.1_Windows_64_8e16de2.zip"
          $expectedHash = "63291726C6FC84EB479EF2EE752E97E1187F6CE9C49FD27EEE40DED588A8172A"
          $runtime = Join-Path $PWD "OpenRGB_1.1_Windows_64_8e16de2.zip"

          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtime
          $actualHash = (Get-FileHash -Path $runtime -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "OpenRGB SHA-256 mismatch. Expected $expectedHash, received $actualHash."
          }

          $sourceUrl = "https://codeberg.org/OpenRGB/OpenRGB/archive/release_1.1.zip"
          $source = Join-Path $PWD "OpenRGB-1.1-source.zip"
          Invoke-WebRequest -Uri $sourceUrl -OutFile $source

          $notices = @"
Third-party runtime bundled for Zenora RGB
===========================================

OpenRGB 1.1 Windows x64 portable build
Upstream: https://codeberg.org/OpenRGB/OpenRGB
Release: https://codeberg.org/OpenRGB/OpenRGB/releases/tag/release_1.1
License: GNU General Public License version 2 or later (GPL-2.0-or-later)
Source code: OpenRGB-1.1-source.zip is provided in this same release.
SHA-256: $expectedHash

Zenora RGB downloads this unmodified upstream archive and verifies the
SHA-256 before extraction. OpenRGB is a separate open-source project.

PawnIO is not redistributed by Zenora RGB. When needed, the app downloads
the installer from its upstream release and verifies its SHA-256:
https://github.com/namazso/PawnIO.Setup/releases/tag/2.2.0
"@
          Set-Content -Path (Join-Path $PWD "THIRD-PARTY-NOTICES.txt") -Value $notices -Encoding utf8

      - name: Create or refresh runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "runtime-v1.1"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "./OpenRGB_1.1_Windows_64_8e16de2.zip" "./OpenRGB-1.1-source.zip" "./THIRD-PARTY-NOTICES.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create $tag "./OpenRGB_1.1_Windows_64_8e16de2.zip" "./OpenRGB-1.1-source.zip" "./THIRD-PARTY-NOTICES.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Zenora RGB Runtime - OpenRGB 1.1" --notes "Unmodified OpenRGB 1.1 Windows x64 portable runtime, distributed under GPL-2.0-or-later with the corresponding source archive and third-party notices. The Windows app downloads this verified runtime automatically."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the OpenRGB runtime release failed."
          }