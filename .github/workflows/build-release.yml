name: Build Windows app

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file EXE
        shell: pwsh
        run: |
          dotnet publish ./src/ZenoraRGB/ZenoraRGB.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output ./publish
          if (!(Test-Path ./publish/ZenoraRGB.exe)) {
            throw "ZenoraRGB.exe was not produced."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenoraRGB-win-x64
          path: ./publish/ZenoraRGB.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or refresh v0.2.0 Release from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "v0.2.0"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "./publish/ZenoraRGB.exe" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create $tag "./publish/ZenoraRGB.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Zenora RGB v0.2.0" --notes "Unified OpenRGB-based Windows RGB control. No Armoury Crate or MSI Center is required. The app downloads a SHA-256 verified OpenRGB runtime from the Zenora GitHub Release and checks/installs PawnIO from its official upstream release when needed. Administrator approval is required for hardware-driver installation."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }

      - name: Create versioned Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" "./publish/ZenoraRGB.exe" --repo "$env:GITHUB_REPOSITORY" --title "Zenora RGB $env:GITHUB_REF_NAME" --generate-notes